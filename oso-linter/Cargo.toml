[package]
name = "oso-linter"
version = "0.1.0"
edition = "2021"
description = "Static analysis linter for OSO-IR JSON programs"

[[bin]]
name = "oso-linter"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
