[package]
name = "oso-simulator"
version = "0.1.0"
edition = "2021"
description = "Dry-run simulator for OSO-IR programs against a mock OSOVM instance"

[[bin]]
name = "oso-sim"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
