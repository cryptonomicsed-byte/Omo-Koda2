[package]
name = "oso-sdk"
version = "0.1.0"
edition = "2021"
description = "Ọ̀ṢỌ́ agent SDK — high-level Rust client for the sovereign job/contract API"

[dependencies]
oso-parser   = { path = "../oso-parser" }
oso-compiler = { path = "../oso-compiler" }
ucx-protocol = { path = "../../sovereign-stack/ucx-protocol" }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "1"
uuid         = { version = "1", features = ["v4"] }
chrono       = { version = "0.4", features = ["serde"] }
