[package]
name = "oso-wasm"
version = "0.1.0"
edition = "2021"
description = "Ọ̀ṢỌ́-IR → WebAssembly Text (WAT) compiler backend"

[[bin]]
name = "oso-wasm"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
