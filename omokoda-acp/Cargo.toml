[package]
name = "omokoda-acp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "omokoda-acp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1.10", features = ["v4"] }
